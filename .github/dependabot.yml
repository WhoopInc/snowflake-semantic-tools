version: 2
updates:
  # Python dependencies: Dependabot reads pyproject.toml and updates poetry.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The actions the workflows use, pinned by commit SHA with a version comment
  # that Dependabot keeps in step.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
