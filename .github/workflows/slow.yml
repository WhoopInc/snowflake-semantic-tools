name: Snowflake checks (manual)

# Optional checks against a real Snowflake account, for maintainers who have one. Nothing triggers
# this workflow but a manual run (Actions > Snowflake checks (manual) > Run workflow), nothing waits
# on it, and a pull request or a release never needs it: the fast gate in test-and-lint.yml is the
# whole required gate, and runs offline with no secrets.
#
# Supply your own account as repository (or fork) secrets:
#
#   SNOWFLAKE_ACCOUNT       account identifier
#   SNOWFLAKE_USER          a key-pair user
#   SNOWFLAKE_PRIVATE_KEY   that user's unencrypted PKCS#8 private key, PEM text
#   SNOWFLAKE_ROLE          a role that may create and drop schemas in SNOWFLAKE_DATABASE
#   SNOWFLAKE_WAREHOUSE     the warehouse the tests run in
#   SNOWFLAKE_DATABASE      a database set aside for test scratch schemas
#   SNOWFLAKE_SCHEMA        the schema the evals suite deploys to (evals only)
#   SNOWFLAKE_GRANTEE_ROLE  optional; a role the test role may grant SELECT to, which adds the
#                           check that replacing a view keeps its grants
#
# Without them the run skips with a notice and succeeds; it never fails for missing credentials.
#
# Suites:
#   live       the real connector against the port contract, apply in a real account, and the CLI
#              end to end through the smoke suite (`pytest -m live`). Each run works in scratch
#              schemas of its own, SST_IT_<UTC stamp>_<run>_<worker>, which the tests drop and the
#              teardown step drops again even when a step failed.
#   sweep      drop SST_IT_* scratch schemas older than `older_than_hours`, the cleanup for a
#              cancelled job or a killed runner
#   recording  re-capture the recorded session and diff it against the committed recording
#   evals      `sst test --suite evals` on the reference project; needs SNOWFLAKE_SCHEMA and a role
#              that may create agents
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which checks to run"
        type: choice
        options:
          - live
          - sweep
          - recording
          - evals
        default: live
      # A live run's budget is minutes, so a scratch schema this old belongs to a job that died.
      # Too short would drop a schema a long run is still using; too long only costs storage.
      older_than_hours:
        description: "sweep: drop scratch schemas at least this many hours old"
        type: string
        default: "6"

permissions:
  contents: read

concurrency:
  group: snowflake-checks-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Check for Snowflake credentials
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          SUITE: ${{ inputs.suite }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          required="SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PRIVATE_KEY SNOWFLAKE_ROLE SNOWFLAKE_WAREHOUSE SNOWFLAKE_DATABASE"
          if [ "$SUITE" = "evals" ]; then
            required="$required SNOWFLAKE_SCHEMA"
          fi
          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snowflake checks skipped: secrets not set:${missing}. These checks are optional; see the header of .github/workflows/slow.yml."
          fi

  run:
    name: Run the ${{ inputs.suite }} checks against Snowflake
    needs: credentials
    if: needs.credentials.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HYPOTHESIS_PROFILE: ci
      SST_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # The test helpers read SST_TEST_SNOWFLAKE_*; the secrets keep plain names.
      SST_TEST_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SST_TEST_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SST_TEST_SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SST_TEST_SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SST_TEST_SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SST_TEST_SNOWFLAKE_GRANTEE_ROLE: ${{ secrets.SNOWFLAKE_GRANTEE_ROLE }}
      SST_EVALS_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SUITE: ${{ inputs.suite }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Check that poetry.lock matches pyproject.toml
        run: |
          poetry check --lock || {
            echo "::error::poetry.lock is out of date with pyproject.toml. Regenerate it with: poetry lock"
            exit 1
          }

      - name: Install dependencies
        run: poetry install --no-interaction

      # The key never reaches the log or the workspace: it is written once, outside the checkout,
      # readable only by the runner user, and removed by the last step.
      - name: Write the Snowflake private key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/sst_test_snowflake.p8"
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$key_path"
          echo "SST_TEST_SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Credentials are present, so a live test that cannot connect fails rather than skips.
      # Driver logging stays at WARNING: the connector at DEBUG can echo connection settings.
      - name: Run the live layers
        if: inputs.suite == 'live'
        run: >-
          poetry run pytest -m live --require-snowflake
          -n 4 --timeout 600 --log-level WARNING
          tests/contract_live tests/integration tests/e2e

      # Drops only schemas named SST_IT_<stamp>_... that carry SST's marker comment, so nothing
      # a person or another pipeline created is in reach.
      - name: Sweep stale scratch schemas
        if: inputs.suite == 'sweep'
        env:
          OLDER_THAN_HOURS: ${{ inputs.older_than_hours }}
        run: poetry run python -m tests.helpers.sweep_scratch --older-than-hours "$OLDER_THAN_HOURS"

      # A difference means Snowflake's answers moved: the project and the schema it is captured
      # in are fixed. The capture is uploaded either way, so a reviewer can commit it.
      - name: Capture and compare the recorded session
        if: inputs.suite == 'recording'
        run: poetry run python -m tests.helpers.session_recorder --out recording/live_project.json

      - name: Upload the capture
        if: always() && inputs.suite == 'recording'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recorded-session
          path: recording/live_project.json
          if-no-files-found: warn

      # The fixture's own `verify` target signs in through a browser; this one, with the same
      # name, signs in with the key. Every value is an env_var reference, so the file holds no
      # credential.
      - name: Write a key-pair profile for the verify target
        if: inputs.suite == 'evals'
        run: |
          mkdir -p "$RUNNER_TEMP/profiles"
          cat > "$RUNNER_TEMP/profiles/profiles.yml" <<'PROFILE'
          sst_reference_impl:
            target: verify
            outputs:
              verify:
                type: snowflake
                authenticator: snowflake_jwt
                account: "{{ env_var('SST_TEST_SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SST_TEST_SNOWFLAKE_USER') }}"
                private_key_path: "{{ env_var('SST_TEST_SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                role: "{{ env_var('SST_TEST_SNOWFLAKE_ROLE') }}"
                warehouse: "{{ env_var('SST_TEST_SNOWFLAKE_WAREHOUSE') }}"
                database: "{{ env_var('SST_TEST_SNOWFLAKE_DATABASE') }}"
                schema: "{{ env_var('SST_EVALS_SCHEMA') }}"
                threads: 4
          PROFILE

      - name: Run the eval suite
        if: inputs.suite == 'evals'
        run: >-
          poetry run sst --output json
          --project-dir tests/fixtures/reference_project
          --profiles-dir "$RUNNER_TEMP/profiles"
          --manifest tests/fixtures/reference_project_manifest.json
          test --suite evals --target verify
          > evals.json

      - name: Upload eval results
        if: always() && inputs.suite == 'evals'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: evals.json
          if-no-files-found: warn

      # Runs even when the live layers failed, so a failing test leaves no schema behind.
      - name: Drop this run's scratch schemas
        if: always() && inputs.suite == 'live'
        run: poetry run python -m tests.helpers.sweep_scratch --run "$SST_TEST_RUN_ID"

      - name: Remove the Snowflake private key
        if: always()
        run: rm -f "$RUNNER_TEMP/sst_test_snowflake.p8"
