name: Publish to PyPI

on:
  push:
    tags:
      # Only run this workflow when a tag like v0.1.0 is pushed.
      # Normal pushes and merges to main do NOT trigger this.
      - "v*.*.*"

# Read-only by default. Only the publish job, which runs no project code and installs
# nothing, is granted the OIDC token PyPI's Trusted Publishing exchanges for an upload.
permissions:
  contents: read

jobs:
  # The whole fast gate -- tests, exit-code conformance, strict typing, lint, ring boundaries,
  # generated docs, bandit, semgrep, pip-audit and the coverage floors and ratchet -- from the
  # same workflow a pull request runs, so a release cannot pass a lighter gate than a merge.
  fast-gate:
    name: Fast gate
    permissions:
      contents: read
    uses: ./.github/workflows/test-and-lint.yml

  build:
    name: Build the distributions
    needs: fast-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install the locked dependencies
        # Every package, the build and test tooling included, comes from poetry.lock.
        run: poetry install --no-interaction

      - name: Verify tag and pyproject.toml version match
        # Extract version from tag, stripping the leading "v".
        # Example: refs/tags/v0.1.0 -> 0.1.0
        # Extract version from pyproject.toml.
        # Assumes a line like: version = "0.1.0"
        run: |
          TAG_REF="${GITHUB_REF}"
          TAG_VERSION="${TAG_REF#refs/tags/v}"

          PYPROJECT_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | sed 's/.*version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/')

          echo "Tag version: ${TAG_VERSION}"
          echo "pyproject.toml version: ${PYPROJECT_VERSION}"

          if [ -z "$PYPROJECT_VERSION" ]; then
            echo "pyproject.toml version could not be determined. Failing."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Version mismatch between tag and pyproject.toml. Failing."
            exit 1
          fi

          echo "Tag and pyproject.toml versions match."

      - name: Build source and wheel distributions
        # poetry build calls the same poetry-core backend as python -m build, without
        # installing an unlocked build frontend. Creates dist/*.tar.gz and dist/*.whl.
        run: |
          rm -rf dist
          poetry build --no-interaction

      - name: Verify build artifacts exist
        run: |
          echo "Built artifacts in dist/:"
          ls -lh dist
          if [ -z "$(ls -A dist)" ]; then
            echo "No build artifacts were produced. Failing."
            exit 1
          fi

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # This environment name must match the one configured in PyPI's
    # "Trusted Publishers" settings for this repository.
    environment:
      name: pypi
      url: https://pypi.org/p/snowflake-semantic-tools

    # The OIDC token is the only credential; the job checks out no code and
    # installs nothing, so no project dependency ever runs with it.
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # The action checks the distributions' metadata (twine check) before uploading.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
