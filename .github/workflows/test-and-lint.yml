name: Test and Lint

on:
  push:
    branches:
      - main
  pull_request:
    # Run on all pull requests regardless of target branch

permissions:
  contents: read

jobs:
  test:
    name: Run tests and linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      # Unit and contract tests. Neither connects to Snowflake.
      - name: Run tests
        run: poetry run pytest tests/ -v

      - name: Check domain coverage
        run: >-
          poetry run pytest -q --cov=snowflake_semantic_tools.domain --cov-branch
          --cov-report=term --cov-fail-under=100
          tests/unit/domain tests/unit/test_render_semantic_view.py

      - name: Check application coverage
        run: >-
          poetry run pytest -q --cov=snowflake_semantic_tools.app --cov-branch
          --cov-report=term --cov-fail-under=95
          tests/unit/app tests/unit/test_compile_use_case.py tests/unit/test_manifest_v1.py

      - name: Check CLI coverage
        run: >-
          poetry run pytest -q --cov=snowflake_semantic_tools.cli --cov-branch
          --cov-report=term --cov-fail-under=90
          tests/unit/cli

      - name: Check strict typing
        run: poetry run mypy snowflake_semantic_tools

      - name: Check code formatting with Black
        run: poetry run black --check snowflake_semantic_tools/

      - name: Check import sorting with isort
        run: poetry run isort --check snowflake_semantic_tools/

      # The four-ring boundaries (cli -> app | adapters -> domain). This step IS the
      # enforcement; tests/unit/test_ring_boundaries.py separately proves the
      # contracts actually reject a crossing rather than passing vacuously.
      - name: Check ring boundaries with import-linter
        run: poetry run lint-imports

      # The reference pages under docs/reference are generated from the engine's
      # registries; a registry change without a regenerated page fails here.
      - name: Check generated reference pages
        run: poetry run sst docs --check
