name: Test and Lint

# Runs with the `pull_request` trigger only, never `pull_request_target`: a fork's
# pull request gets a read-only token and no repository secrets. The suite needs
# neither, since nothing here connects to Snowflake.
on:
  push:
    branches:
      - main
  pull_request:
    # Run on all pull requests regardless of target branch

permissions:
  contents: read

jobs:
  test:
    name: Run tests and linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Deterministic property tests, so a failure on a pull request reproduces on rerun.
      HYPOTHESIS_PROFILE: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      # Unit, contract, and diagnostic-code guard tests. None connects to Snowflake.
      - name: Run tests
        run: poetry run pytest tests/ -v -n auto

      - name: Check domain coverage
        run: >-
          poetry run pytest -q --cov=snowflake_semantic_tools.domain --cov-branch
          --cov-report=term --cov-fail-under=100
          tests/unit/domain tests/unit/test_render_semantic_view.py

      - name: Check application coverage
        run: >-
          poetry run pytest -q --cov=snowflake_semantic_tools.app --cov-branch
          --cov-report=term --cov-fail-under=95
          tests/unit/app tests/unit/test_compile_use_case.py tests/unit/test_manifest_v1.py

      - name: Check CLI coverage
        run: >-
          poetry run pytest -q --cov=snowflake_semantic_tools.cli --cov-branch
          --cov-report=term --cov-fail-under=90
          tests/unit/cli

      # A ratchet, measured over the whole suite: raise the floor as coverage rises, never lower it.
      - name: Check adapters coverage
        run: >-
          poetry run pytest -q -n auto --cov=snowflake_semantic_tools.adapters --cov-branch
          --cov-report=term --cov-fail-under=90
          tests/

      - name: Check strict typing
        run: poetry run mypy snowflake_semantic_tools tests

      - name: Check code formatting with ruff
        run: poetry run ruff format --check snowflake_semantic_tools/ tests/

      - name: Lint with ruff
        run: poetry run ruff check snowflake_semantic_tools/ tests/

      # The four-ring boundaries (cli -> app | adapters -> domain). This step IS the
      # enforcement; tests/unit/test_ring_boundaries.py separately proves the
      # contracts actually reject a crossing rather than passing vacuously.
      - name: Check ring boundaries with import-linter
        run: poetry run lint-imports

      # The reference pages under docs/reference are generated from the engine's
      # registries; a registry change without a regenerated page fails here.
      - name: Check generated reference pages
        run: poetry run sst docs --check

      # Medium and high severity findings fail the build. No check is skipped: every
      # statement is composed through domain/sql, so B608 has nothing to report.
      - name: Scan for security issues with bandit
        run: poetry run bandit -r snowflake_semantic_tools -ll

      # Known vulnerabilities in the locked dependencies. The project itself is
      # installed editable and is not on PyPI at this version, so it is skipped.
      - name: Audit dependencies with pip-audit
        run: poetry run pip-audit --skip-editable --progress-spinner off
