name: Nightly

# Scheduled checks that are too slow, or too non-deterministic, to gate a pull request. None of
# them blocks a merge: each reports, and a regression it finds is fixed in the next change. Both
# run offline and need no secrets.
#
#   mutation   mutmut over domain/; report-only, the results uploaded as an artifact
#   property   the property tests under the deeper, randomised `nightly` Hypothesis profile
#
# The checks that connect to Snowflake (the scratch sweep, the recorded-session capture, the evals)
# are in slow.yml, which runs only when a maintainer starts it by hand.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing over domain/
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      # [tool.mutmut] in pyproject.toml scopes the run to domain/ and the tests that cover it.
      # Report-only: the step's own exit status is recorded, never acted on.
      - name: Run mutmut
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          poetry run mutmut run --max-children 4 || echo "::warning::mutmut exited $?"
          poetry run mutmut export-cicd-stats || true
          poetry run mutmut results > mutants/mutmut-results.txt || true
          tail -n 20 mutants/mutmut-results.txt || true

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutmut-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-results.txt
          if-no-files-found: warn

  property:
    name: Property tests, nightly profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run the suite under the nightly Hypothesis profile
        run: poetry run pytest -q -n auto tests/
