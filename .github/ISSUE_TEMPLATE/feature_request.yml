name: Feature Request
description: Suggest a new feature or enhancement for SST
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide details to help us understand your request.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      placeholder: |
        Example:
        Our project routes finance views to their own schema with a folder route, but --select takes only a view name or type:<type>, so planning just the finance views in CI means listing each one.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or approach
      placeholder: |
        Example:
        Accept path:<folder> in --select and --exclude, matching every artifact authored under that folder.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or workarounds have you considered?
      placeholder: |
        Example:
        - Repeat --select once per view
        - Split the finance views into a separate project

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Would significantly improve workflow
        - Medium - Nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who would benefit from this feature? How widely applicable is it?
      placeholder: |
        Example:
        - Any project that routes views into several schemas
        - Teams that plan and apply one domain at a time in CI

  - type: textarea
    id: technical
    attributes:
      label: Technical Considerations
      description: Any technical details, implementation ideas, or code references (optional)
      placeholder: |
        Example:
        Selectors are parsed in the CLI ring (snowflake_semantic_tools/cli/), and the SST manifest already records each artifact's source_files, so a path selector could match on those.

  - type: textarea
    id: example
    attributes:
      label: Example Usage
      description: Show how you'd use this feature (commands, configuration, code examples)
      placeholder: |
        ```bash
        sst plan --target prod --select path:semantic_models/semantic_views/finance
        ```

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have described a clear problem and solution
          required: true
        - label: I have considered alternatives and workarounds
          required: true
