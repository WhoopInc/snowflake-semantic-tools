name: Bug Report
description: Report a bug or unexpected behavior in SST
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us diagnose and fix the issue.
        Remove account, user, database, and schema names and any credentials before submitting.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is
      placeholder: "Example: sst validate reports SST-REF001 for a model that dbt ls lists"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "Example: {{ ref('orders') }} in the view's tables: resolves, because orders is a model in the dbt project"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include the diagnostics verbatim and the exit code)
      placeholder: |
        Example:
        ```
        error[SST-REF001]: {{ ref('orders') }} is not a model in the dbt manifest
        ```
        Exit code 1.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. `dbt ls --select orders` lists the model
        2. Add `{{ ref('orders') }}` to a view's `tables:` in `semantic_models/semantic_views/sales.yml`
        3. Run `sst validate --no-snowflake-syntax-check`
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      value: |
        - SST version (`sst --version`): [e.g., 1.0.0]
        - Python version: [e.g., 3.12.4]
        - dbt version (`dbt --version`), if the project uses dbt: [e.g., 1.11.2]
        - Authentication method (the `authentication` line of `sst debug`): [e.g., externalbrowser]
        - Operating System: [e.g., macOS 15, Ubuntu 24.04]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any relevant output. `--output json` prints every diagnostic with its code, location, and suggestion.
      placeholder: "Paste relevant output here"
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, related issues, workarounds tried, etc.)

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have included all required environment details
          required: true
        - label: I have provided minimal reproduction steps
          required: true
