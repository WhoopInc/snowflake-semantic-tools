name: Documentation Issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SST documentation! Clear docs help everyone.
        The pages under docs/reference/ are generated by `sst docs` from the engine itself; for those, name the command, option, configuration key, or error code.

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: What type of documentation needs attention?
      options:
        - Missing documentation
        - Incorrect/outdated information
        - Unclear explanation
        - Example needed
        - Typo/formatting issue
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Documentation Location
      description: Where is the documentation issue? (file path, URL, section name)
      placeholder: |
        Example:
        - File: docs/guides/ci-cd.md, Section "On merge"
        - README.md, Quick start section
        - `sst plan --help`, or its entry in docs/reference/cli.md
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What's Wrong or Missing?
      description: Describe the documentation issue clearly
      placeholder: |
        Example:
        The CI/CD guide shows the job that runs sst apply, but not which privileges its role needs.
        Our first merge job failed partway through the apply.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should the documentation be improved?
      placeholder: |
        Example:
        Add a "Privileges" section explaining:
        1. What the applying role needs for each artifact type it publishes
        2. That SST also creates its state table in the target schema
        3. A link to it from the CI/CD guide

  - type: textarea
    id: example
    attributes:
      label: Proposed Content (Optional)
      description: Draft the documentation content you'd like to see
      placeholder: |
        ```markdown
        ## Privileges

        The role that runs `sst apply` needs, in each schema it publishes to:

        - `CREATE SEMANTIC VIEW`, for semantic views;
        - `CREATE TABLE`, for the state table (`SST_STATE` by default).
        ```

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who is this documentation for?
      options:
        - New users (getting started)
        - Experienced users (advanced features)
        - Contributors (development)
        - All users
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have clearly identified what needs to be improved
          required: true
        - label: I have suggested a concrete improvement
          required: true
