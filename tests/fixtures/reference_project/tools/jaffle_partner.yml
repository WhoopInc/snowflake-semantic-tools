---
# =============================================================================
# tools/jaffle_partner.yml -- reference project
# =============================================================================
# The immutable tool group: partner-owned objects this repo may read and must
# never write. `immutable: true` makes any `define:` here an error (SST-VAL606),
# so every member is a `reference:`: no DDL is emitted, and `relations:` names
# each member's object per target. The members cover the kinds the mutable
# group (tools/jaffle_platform.yml) does not use: agent, generic and stage.
# =============================================================================

tools:
  - group: jaffle_partner
    description: |-
      Objects owned by delivery and payment partners. This repo reads them and must
      never create, replace or drop any of them.
    owner: partner-integrations
    immutable: true

    reference:
      # ---- agent: the delegate jaffle_delivery_agent routes to -----------
      - name: partner_delivery_agent
        type: agent
        description: |-
          Partner-operated agent answering delivery-status questions. Referenced so
          a jaffle agent can route to it; never created here.
        relations:
          dev: SCRATCH.SST_1_REFERENCE_IMPL.DELIVERY_AGENT
          prod: SST_REF_PROD.PARTNER.DELIVERY_AGENT

      # ---- generic --------------------------------------------------------
      - name: payment_settlement_view
        type: generic
        description: |-
          Settlement records published by the payment partner. The generic kind is
          the escape hatch for an object whose type SST does not model.
        relations:
          dev: SST_REF_DEV.PARTNER.SETTLEMENTS
          prod: SST_REF_PROD.PARTNER.SETTLEMENTS

      # ---- stage: referenced only; under `define:` SST would emit
      # CREATE STAGE IF NOT EXISTS for it.
      - name: partner_invoice_stage
        type: stage
        description: |-
          Stage the payment partner drops invoices into. Read-only to this repo.
        relations:
          dev: SST_REF_DEV.PARTNER.INVOICE_STAGE
          prod: SST_REF_PROD.PARTNER.INVOICE_STAGE
