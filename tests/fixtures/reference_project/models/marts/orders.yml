---
# orders: one row per order, read by both jaffle_sales and jaffle_menu. It is
# the left side of the joins to customers, locations and pricing_periods, and
# the ASOF target of order_items.

version: 2

models:
  - name: orders
    description: |-
      One row per order. The primary transaction grain of the jaffle shop.
    config:
      contract:
        enforced: true
      on_schema_change: fail
      meta:
        sst:
          # Declared once on the model, so every view that reads orders renders
          # PRIMARY KEY (ORDER_ID). A model a view reads with no key warns
          # (SST-VAL312).
          primary_key:
            - order_id
    columns:
      - name: order_id
        data_type: VARCHAR
        description: |-
          Surrogate key for the order. An identifier, therefore a dimension.
        config:
          meta:
            sst:
              column_type: dimension
              is_enum: false
              synonyms:
                - order key
                - order number
        data_tests:
          - unique
          - not_null

      # The join key of orders_to_customers.
      - name: customer_id
        data_type: VARCHAR
        description: |-
          The customer who placed this order.
        config:
          meta:
            sst:
              column_type: dimension
              is_enum: false
              synonyms:
                - customer key
                - who placed the order
        data_tests:
          - not_null
          - relationships:
              # dbt 1.11 expects generic-test arguments under arguments:.
              arguments:
                to: ref('customers')
                field: customer_id

      - name: location_id
        data_type: VARCHAR
        description: |-
          The store location where this order was placed.
        config:
          meta:
            sst:
              column_type: dimension
              is_enum: false
              synonyms:
                - shop key
                - where the order was placed
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id

      # One column in two join kinds: the ASOF column of order_items_to_orders
      # and the BETWEEN subject of orders_to_pricing_periods. The condition,
      # not the column, decides the kind.
      - name: ordered_at
        data_type: TIMESTAMP_NTZ
        description: |-
          When the order was placed.
        config:
          meta:
            sst:
              column_type: dimension
              synonyms:
                - order date
                - purchase time
                - when the order was placed
              sample_values:
                - "2024-07-04 12:15:00"
                - "2024-07-04 18:42:00"

      - name: order_state
        data_type: VARCHAR
        description: |-
          Fulfilment state of the order. A closed set.
        config:
          meta:
            sst:
              column_type: dimension
              is_enum: true
              synonyms:
                - order status
                - fulfilment state
              sample_values:
                - completed
                - returned
                - placed

      - name: subtotal
        data_type: NUMBER(38,2)
        description: |-
          Order value before tax, in cents.
        config:
          meta:
            sst:
              column_type: fact
              synonyms:
                - pre-tax total
                - net amount
                - amount before tax
              sample_values:
                - 850
                - 1100

      - name: tax_paid
        data_type: NUMBER(38,2)
        description: |-
          Tax collected on this order, in cents.
        config:
          meta:
            sst:
              column_type: fact
              synonyms:
                - tax amount
                - sales tax charged
              sample_values:
                - 68
                - 88

      - name: order_total
        data_type: NUMBER(38,2)
        description: |-
          Order value including tax, in cents.
        config:
          meta:
            sst:
              column_type: fact
              synonyms:
                - gross total
                - amount charged
                - order value
              sample_values:
                - 918
                - 1188

    data_tests:
      # Asserts the declared grain. A model that fans out to one row per line
      # item breaks every metric while every ref still resolves.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
