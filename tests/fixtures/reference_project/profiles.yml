---
# =============================================================================
# profiles.yml -- reference project
# =============================================================================
# The dbt profile SST reads its targets from. SST's --target is a dbt target: a
# name not declared here is refused (SST-CFG010), and a `relations:` key in
# tools/*.yml that names an undeclared target is SST-REF018.
#
# `dev` is the default and the golden target: every file under
# tests/golden/expected/ resolves against it.
#
# `dev`, `prod` and `ci` name an account and a user but carry no credential, so
# they cannot connect; the fixture runs offline against them, and the tests run
# them against a recorded session. `verify` is the connected target.
# =============================================================================

sst_reference_impl:
  target: dev

  outputs:
    dev:
      type: snowflake
      account: sst_reference
      user: sst_reference
      database: SST_REF_DEV
      schema: JAFFLE
      warehouse: SST_REF_WH
      threads: 4

    # Every tool reference maps dev and prod to different objects, so
    # `--target prod` resolves them all.
    prod:
      type: snowflake
      account: sst_reference
      user: sst_reference
      database: SST_REF_PROD
      schema: JAFFLE
      warehouse: SST_REF_WH
      threads: 4

    # Declared, but mapped by no tool `relations:`, so `--target ci` reports
    # SST-REF018 for every referenced tool object.
    ci:
      type: snowflake
      account: sst_reference
      user: sst_reference
      database: SST_REF_CI
      schema: JAFFLE
      warehouse: SST_REF_WH
      threads: 4

    # Runs the fixture in a real account; every value comes from the
    # environment. Account, user, role, schema and warehouse have no default, so
    # an unset one stops at profile load with the variable named. The database
    # defaults to SCRATCH and the authenticator to externalbrowser (SSO). Like
    # `ci`, it is absent from `relations:`, and no golden resolves against it.
    # Build the dbt models there with:
    #
    #   dbt deps
    #   dbt build --target verify
    verify:
      type: snowflake
      account: "{{ env_var('SST_VERIFY_ACCOUNT') }}"
      user: "{{ env_var('SST_VERIFY_USER') }}"
      authenticator: "{{ env_var('SST_VERIFY_AUTHENTICATOR', 'externalbrowser') }}"
      role: "{{ env_var('SST_VERIFY_ROLE') }}"
      database: "{{ env_var('SST_VERIFY_DATABASE', 'SCRATCH') }}"
      schema: "{{ env_var('SST_VERIFY_SCHEMA') }}"
      warehouse: "{{ env_var('SST_VERIFY_WAREHOUSE') }}"
      threads: 4
