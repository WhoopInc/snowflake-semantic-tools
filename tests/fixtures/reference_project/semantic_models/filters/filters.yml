---
# Three boolean filters carry labels: [filter] and render as LABELS = (FILTER)
# dimensions on ORDERS. The fourth is not boolean and has no labels, so it
# renders as a sentence in AI_SQL_GENERATION. A boolean filter without labels
# is SST-VAL405; a labelled filter that is not boolean is SST-VAL401.
#
# Each filter attaches to every view that holds its tables. The order_state
# literals come from the completed_state and returned_state vars in
# sst_config.yml.

snowflake_filters:

  # tables: repeats what the ref in expr already implies; only
  # high_value_threshold_cents needs it.
  - name: is_completed_order
    tables:
      - "{{ ref('orders') }}"
    description: |-
      Restricts to orders that completed, excluding returns and orders still in
      flight. The default lens for any revenue question.
    expr: "{{ ref('orders', 'order_state') }} = '{{ var('completed_state') }}'"
    labels:
      - filter

  - name: is_returned_order
    tables:
      - "{{ ref('orders') }}"
    description: |-
      Restricts to orders that were returned. The complement lens, for questions
      about return rate rather than revenue.
    expr: "{{ ref('orders', 'order_state') }} = '{{ var('returned_state') }}'"
    labels:
      - filter

  # Reads the view variable large_order_cents as a bare identifier; it renders
  # as ORDERS.ORDER_TOTAL > LARGE_ORDER_CENTS.
  - name: is_large_order
    tables:
      - "{{ ref('orders') }}"
    description: |-
      Restricts to orders above the view's large-order threshold.
    expr: "{{ ref('orders', 'order_total') }} > large_order_cents"
    labels:
      - filter

  # Not boolean and unlabelled, so it renders in AI_SQL_GENERATION as "For
  # ORDERS, high_value_threshold_cents is large_order_cents." followed by its
  # description. Adding labels: [filter] would make it SST-VAL401.
  - name: high_value_threshold_cents
    # Its expr names no column, so tables: is what attaches it; a filter that
    # renders as prose needs exactly one declared table.
    tables:
      - "{{ ref('orders') }}"
    description: |-
      The order value above which a sale is treated as high-value in generated
      narrative. A threshold, not a predicate.
    expr: "large_order_cents"
