---
# Six relationships: four equality, one ASOF and one range. Each condition is a
# SQL string over ref() columns, and its operator sets the join kind:
#
#   a = b               equality  REFERENCES t (key)
#   a >= b              ASOF      REFERENCES t (key, ASOF col)
#   a BETWEEN s AND e   range     REFERENCES t (BETWEEN s AND e EXCLUSIVE)
#
# left_table is the many side and right_table the one side, written as bare
# model names; a ref() call there is SST-REF045. A relationship attaches to
# every view that holds both its tables.

snowflake_relationships:
  # Attaches to jaffle_sales, the one view holding both tables. A relationship
  # that fits no view is SST-VAL205.
  - name: orders_to_customers
    description: |-
      Each order belongs to exactly one customer. Many orders to one customer, so
      `orders` is the left table.
    left_table: orders
    right_table: customers
    relationship_conditions:
      - "{{ ref('orders', 'customer_id') }} = {{ ref('customers', 'customer_id') }}"

  # The second relationship in jaffle_sales, so its RELATIONSHIPS clause holds
  # more than one entry.
  - name: orders_to_locations
    description: |-
      Each order is placed at exactly one store location. Many orders to one
      location, so `orders` is the left table.
    left_table: orders
    right_table: locations
    relationship_conditions:
      - "{{ ref('orders', 'location_id') }} = {{ ref('locations', 'location_id') }}"

  # Renders ORDER_ITEMS (ORDER_ID, OCCURRED_AT) REFERENCES ORDERS (ORDER_ID,
  # ASOF ORDERED_AT): each line item matches its order as of when the item was
  # recorded.
  - name: order_items_to_orders
    description: |-
      Each line item is attributed to the order state in effect when the item was
      recorded, rather than to the order's current state.
    left_table: order_items
    right_table: orders
    relationship_conditions:
      # The key equality, then the ASOF comparison. >= is the only ASOF
      # operator SST parses, and Snowflake allows one ASOF column per
      # relationship.
      - "{{ ref('order_items', 'order_id') }} = {{ ref('orders', 'order_id') }}"
      - "{{ ref('order_items', 'occurred_at') }} >= {{ ref('orders', 'ordered_at') }}"

  # BETWEEN makes this a range relationship. Snowflake requires a DISTINCT
  # RANGE constraint on the target, which jaffle_menu declares as the
  # distinct_range of pricing_periods. The end bound renders EXCLUSIVE.
  - name: orders_to_pricing_periods
    description: |-
      Each order falls inside exactly one pricing period, determined by when it was
      placed.
    left_table: orders
    right_table: pricing_periods
    relationship_conditions:
      - "{{ ref('orders', 'ordered_at') }} BETWEEN {{ ref('pricing_periods', 'effective_start_at') }} AND {{ ref('pricing_periods', 'effective_end_at') }}"

  - name: order_items_to_products
    description: |-
      Each line item sells exactly one product. Many line items to one product, so
      `order_items` is the left table.
    left_table: order_items
    right_table: products
    relationship_conditions:
      - "{{ ref('order_items', 'product_id') }} = {{ ref('products', 'product_id') }}"

  # The only relationship of the snapshot table. With it, jaffle_menu's five
  # tables and four relationships form a tree: one path between any two
  # tables, so no ambiguous path (SST-VAL209) and no cycle (SST-VAL215).
  - name: supplies_to_products
    description: |-
      Each supply-cost snapshot row belongs to exactly one product. Many monthly
      snapshots to one product, so `supplies` is the left table.
    left_table: supplies
    right_table: products
    relationship_conditions:
      - "{{ ref('supplies', 'product_id') }} = {{ ref('products', 'product_id') }}"
