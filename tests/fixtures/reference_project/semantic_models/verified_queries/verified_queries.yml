---
# Four verified queries, one per authoring variant:
#
#   order_count_by_state    inline sql, onboarding, verified_at as epoch seconds
#   revenue_by_location     inline sql, onboarding, verified_at as a date string
#   product_mix_by_type     sql_file sidecar, no optional keys
#   total_revenue_all_time  inline sql, no optional keys
#
# An absent optional key is left out of the rendered entry, not rendered empty.
# A query's SQL names each table with {{ ref('<model>') }}, which renders as the
# table's logical name in the view; its tables are those models, and it
# attaches to every view that holds all of them. SQL bodies render as
# multi-line literals with single quotes doubled.

snowflake_verified_queries:

  - name: order_count_by_state
    description: |-
      Order volume split by fulfilment state. The canonical first question against
      jaffle_sales.
    question: "How many orders are there in each fulfilment state?"
    sql: |-
      SELECT
            orders.order_state                  AS order_state
          , COUNT(DISTINCT orders.order_id)     AS order_count
      FROM {{ ref('orders') }} AS orders
      GROUP BY ALL
      ORDER BY order_count DESC
    use_as_onboarding_question: true
    # Epoch seconds, rendered as written.
    verified_at: 1769904000
    verified_by: "analytics-platform"

  - name: revenue_by_location
    description: |-
      Total revenue per store location, completed orders only.
    question: "What is total revenue by store location?"
    sql: |-
      SELECT
            locations.location_name                       AS location_name
          , SUM(orders.order_total) / 100                 AS revenue
      FROM {{ ref('orders') }} AS orders
      INNER JOIN {{ ref('locations') }} AS locations
          ON orders.location_id = locations.location_id
      WHERE orders.order_state = 'completed'
      GROUP BY ALL
      ORDER BY revenue DESC
    use_as_onboarding_question: true
    # A date string, rendered as epoch seconds at midnight UTC (1767225600).
    verified_at: "2026-01-01"
    verified_by: "analytics-platform"

  # sql_file: resolves against this file's directory. SST drops the sidecar's
  # leading comment block, so the rendered SQL starts at SELECT.
  - name: product_mix_by_type
    description: |-
      Units sold split by whether the item is food or drink. Held in a sidecar so
      the fixture exercises the external-SQL path.
    question: "How many units did we sell of food versus drink?"
    sql_file: sql/product_mix_by_type.sql

  # The minimal entry: it renders only QUESTION and SQL. Keep it that way.
  - name: total_revenue_all_time
    description: |-
      A single total. The smallest valid verified query in this fixture.
    question: "What is our total revenue?"
    sql: |-
      SELECT
          SUM(orders.order_total) / 100 AS revenue
      FROM {{ ref('orders') }} AS orders
