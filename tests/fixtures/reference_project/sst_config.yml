---
# =============================================================================
# sst_config.yml -- reference project
# =============================================================================
# Targeting and policy only; content (descriptions, owners, signatures) lives in
# the spec files. Every number is a threshold, limit, count or timeout, never
# member data.
#
# Every database is written `{{ target.database }}`, so each dbt target in
# profiles.yml publishes to its own database; the goldens resolve against `dev`.
# A `+` key sets a default that folder routes and individual artifacts inherit.
#
# An unknown key is a warning (SST-CFG003) and a misspelled top-level block an
# error (SST-CFG007). Removed keys are SST-CFG043; keys reserved for a later
# release are SST-CFG044.
# =============================================================================

snowflake:
  # The orchestration models agents may name (SST-VAL543). Snowflake's served
  # set is not an enum and changes, so this list is the gate. `auto` is what an
  # agent resolves to when neither it nor `agents:` names a model. `tool_types`
  # is reserved (SST-CFG044).
  orchestration_models:
    - auto
    - claude-haiku-4-5
    - claude-opus-4-5
    - claude-opus-4-6
    - claude-opus-4-7
    - claude-opus-4-8
    - claude-opus-5
    - claude-opus-5-5
    - claude-sonnet-4-5
    - claude-sonnet-4-6
    - claude-sonnet-5
    - gemini-3.1-pro
    - gemini-3.5-flash
    - gemini-3.7-flash
    - gemini-3.8-flash
    - grok-4.6
    - openai-1p-gpt-5.4
    - openai-gpt-4.1
    - openai-gpt-5
    - openai-gpt-5-mini
    - openai-gpt-5.1
    - openai-gpt-5.2
    - openai-gpt-5.4
    - openai-gpt-5.5

project:
  # Every value is the default, written out so each root is visible; a root
  # written here must exist (SST-CFG047). There is no key for dbt models: SST
  # reads them from dbt's manifest.
  semantic_models_dir: semantic_models
  agents_dir: agents
  tools_dir: tools
  skills_dir: skills
  # Custom LLM-judge metrics. They create no Snowflake object: each is inlined
  # into the rendered eval config of the agents that use it.
  eval_metrics_dir: eval_metrics
  # CoCo Desktop inputs: plugins group skills into one extension, profiles are
  # registry rows, and hooks, MCP configs and commands are what profiles name.
  plugins_dir: plugins
  profiles_dir: profiles
  hooks_dir: hooks
  mcp_servers_dir: mcp-servers
  commands_dir: commands

# `{{ var('<name>') }}` reads this block; an undeclared name is SST-REF038. A var
# is substituted at compile time, so it means the same in every view. These two
# name `order_state` values used by filters.yml and metrics.yml. `sha_version`
# is supplied by SST; declaring it here is SST-CFG040.
vars:
  completed_state: completed
  returned_state: returned

# Apply records what it published here, keyed by target, and plan reads it to
# tell changed artifacts from unchanged ones. These are the defaults: each
# target keeps its state in its own database and schema.
state:
  +database: "{{ target.database }}"
  +schema: "{{ target.schema }}"
  +table: SST_STATE

# Tag object names for `{{ tag('<name>') }}`; an undeclared name is SST-REF040.
# A name resolves to default_prefix plus the upper-cased key. SST applies tag
# values but never creates a tag object, so these must already exist.
tags:
  default_prefix: "{{ target.database }}.{{ target.schema }}"
  cost_center: {}                       # -> <db>.<schema>.COST_CENTER
  data_domain: {}                       # -> <db>.<schema>.DATA_DOMAIN
  metric_tier: {}                       # -> <db>.<schema>.METRIC_TIER

validation:
  # Every warning becomes an error; --strict/--no-strict on validate, plan and
  # apply overrides this. Offline, the fixture has one warning, SST-VAL528 on
  # jaffle_delivery's agent tool, so a strict run fails on it; the offline CLI
  # tests pass --no-strict.
  strict: true

  # The default: validate and plan compile expressions against Snowflake, which
  # needs a connection. Offline runs pass --no-snowflake-syntax-check, and
  # validate reports the skip as SST-VAL020 rather than as a pass.
  snowflake_syntax_check: true

  # Removed (SST-CFG043): `expression_rules` (the derived-metric rules
  # SST-VAL102 to SST-VAL107 always run), `multipath_check` (always on; a metric
  # with an ambiguous join path declares using_relationships, SST-VAL116) and
  # `smoke_query` (smoke probes run under `sst test --suite smoke`).

tools:
  # Defaults for `define:` members only; `reference:` members are never
  # created. Per-group routes are reserved (SST-CFG044) and `+enabled` is
  # removed (SST-CFG043).
  +database: "{{ target.database }}"
  +schema: JAFFLE

  # Defined search services and procedures run on this warehouse.
  +warehouse: SST_REF_WH

  +target_lag: "1 hour"

  # Pinned rather than left to Snowflake's default: the embedding model decides
  # retrieval, and so the answers built on it.
  +embedding_model: snowflake-arctic-embed-m-v1.5

  # Defined procedures run with the caller's rights; `owner` would let one read
  # data the calling user cannot.
  +execute_as: caller

semantic_views:
  +database: "{{ target.database }}"
  +schema: JAFFLE

  # A folder route. An unprefixed key names a directory under
  # semantic_models/semantic_views/ (SST-CFG041 if it is missing), and its `+`
  # keys override per key: views in core/ publish to <db>.CORE and still inherit
  # +database and +enabled from this block.
  core:
    +schema: CORE
  +enabled: true

  # Views publish as CREATE OR REPLACE SEMANTIC VIEW ... COPY GRANTS, so explicit
  # grants survive a republish. `+tags` and `+max_staleness` are reserved
  # (SST-CFG044); `+meta` is removed (SST-CFG043).

agents:
  # Evals publish into their agent's schema, so these also place the evals.
  # Agents are created once and then versioned, so `+create_mode` and
  # `+copy_grants` are removed (SST-CFG043).
  +database: "{{ target.database }}"
  +schema: JAFFLE
  +enabled: true

  # Pinned, not `auto`: `auto` lets Snowflake change the model between runs, so
  # a blocking eval could not attribute a score change.
  +orchestration_model: claude-sonnet-4-6

  # Unset: agent tools run on the target warehouse (SST_REF_WH on dev). A
  # generic tool must resolve some warehouse (SST-VAL527).
  +warehouse: null

  +query_timeout: 60

  +budget_seconds: 120
  +budget_tokens: 16000

  # `reject`: a caller who lacks access to a tool gets an error instead of an
  # answer from fewer tools, which an eval running under another role would miss.
  +tool_not_accessible: reject

  # Needs a cortex_search tool (SST-VAL546) and adds AI function cost.
  +analytical_search: false

  # Moved to each newly published version. LIVE, FIRST, LAST and DEFAULT are
  # reserved (SST-PRS025); SST writes this one unquoted, as PROMOTED.
  +alias: promoted

evals:
  # No +database or +schema: eval objects live in their agent's schema, and
  # setting either is SST-CFG015. `+enabled` is removed (SST-CFG043).
  +eval_tier: blocking

  +metrics:
    # Deterministic (no LLM judge), so it is the metric the eval config gates on.
    - tool_selection_accuracy
    # Judged; the eval config reports it without gating.
    - answer_correctness

  # Pinned so scores stay comparable across runs; an unpinned system metric is
  # SST-VAL722.
  +metric_version: v3

  # The last committed version. LIVE, or no version, is SST-VAL719.
  +agent_version: committed

  +retry: 1
  +concurrency: 2

  # Scores vary between runs, so a baseline takes five completed attempts.
  +baseline_runs: 5

  +retention: audit

skills:
  # Omitting a channel block below disables that channel; at least one is
  # required (SST-VAL817). `+enabled` and `+grant_read_to` are removed
  # (SST-CFG043): SST issues no grants on extensions.

  # `true` would tag each new version SNOWFLAKE.CORE.CERTIFICATION_STATUS =
  # 'CERTIFIED'. SST never un-certifies, so the fixture leaves it off.
  +certified: false

  # A version alias is this prefix plus 12 hex characters of the bundle digest,
  # so unchanged content keeps its alias and publishes nothing new. Agents that
  # reference a skill with skill() or plugin() are pinned to its current alias.
  +version_prefix: "SST_"

  +threads: 4

  # Extensions this project consumes but does not publish. `{{ extension('<name>') }}`
  # resolves an entry's `fqn:`, or default_prefix plus the UPPER_SNAKE name.
  # extension() on an extension this project publishes is SST-REF037.
  extensions:
    default_prefix: "{{ target.database }}.PARTNER"
    partner-glossary: {}

  catalog:
    +database: "{{ target.database }}"
    +schema: JAFFLE

    # The internal stage ADD VERSION reads from, created when absent. Each
    # version uploads under its own prefix, <stage>/<name>/<ALIAS>/, holding
    # skills/<name>/SKILL.md, so a published version's files never change.
    +bundle_stage: SKILL_BUNDLE_SRC

    # Must be true (SST-VAL818): agents read supporting files beside SKILL.md,
    # so reference/x.md publishes as reference__x.md.
    +flatten: true
    # `+registry_table` and `+prune_deleted` are removed (SST-CFG043).

  stage:
    +database: "{{ target.database }}"
    +schema: JAFFLE
    +stage: SKILL_BUNDLES
    # A rehearsal registry in this schema. CoCo Desktop reads only
    # CORTEX_CODE.CONFIG.PROFILE_REGISTRY, so SST-VAL854 notes on every run that
    # Desktop will not see these rows. SST creates the table when absent and
    # refuses one with the wrong shape (SST-PLN029).
    +registry_table: PROFILE_REGISTRY
    # Must be false (SST-VAL818): Desktop expects the authored nested layout.
    +flatten: false
    # Must be false (SST-VAL819): compressed uploads are invisible to Desktop.
    +auto_compress: false
    # The only layout (SST-VAL821): trees under skills/, prompts/, mcp/ and hooks/.
    +layout: by_type

apply:
  # `agent_spec_stage` takes a location. `eval_config_stage` takes only a stage
  # name, because eval configs are staged in each agent's own schema. Publish
  # order is fixed by artifact type (semantic views, tools, skills, plugins,
  # profiles, agents, evals), not configured. `deploy:` is a removed name for
  # this block (SST-CFG043).
  agent_spec_stage:
    database: "{{ target.database }}"
    schema: JAFFLE
    stage: AGENT_SPECS_SSE
  eval_config_stage:
    stage: EVAL_CONFIGS
