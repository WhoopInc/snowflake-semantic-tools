---
# Eval questions for jaffle_analytics_agent: a two-tool decomposition, a
# routing case, a refusal, and one fixed value.
#
# Renders to a two-column source table (INPUT_QUERY VARCHAR, and GROUND_TRUTH
# VARIANT filled with PARSE_JSON), then a DATASET built from it with
# SYSTEM$CREATE_EVALUATION_DATASET. Golden for the table:
#   tests/golden/expected/eval/jaffle_analytics_source.sql
# That call names the two columns `query_text` and `expected_tools`, while
# `dataset.column_mapping` in config.yml calls them `query_text` and
# `ground_truth`.
#
# Both objects land in the agent's database and schema, because results are
# read back through the agent. `database`, `schema` and `enabled` are therefore
# rejected here (`SST-VAL703`).
#
# Questions carry no identifiers, names or dates. Only the last row hardcodes a
# figure.

# Must name the agent whose `evals:` block points here (`SST-REF012`).
agent: jaffle_analytics_agent

# For reviewers only; never rendered into anything sent to Snowflake.
description: |-
  Four records covering the order analytics agent's dominant failure modes:
  answering a two-view question from one view, answering a menu-catalogue question
  without search evidence, answering an individual-customer question at all, and
  confusing products that exist with products that have sold.

questions:
  # Decomposition: the expected answer needs both analyst tools. Location names
  # exist only in JAFFLE_SALES, and the two views share only `orders`.
  - question: How does order event volume compare with the number of orders in each location?
    ground_truth:
      ground_truth_invocations:
        # Names must match the agent's resolved tool names exactly, case
        # included (`SST-VAL708`). An analyst tool takes its semantic view's
        # name, uppercased; the search tool keeps its authored name.
        - tool_name: JAFFLE_MENU
          # `tool_input` and `tool_output` describe the intended call in prose,
          # not SQL. `tool_execution_accuracy` is the metric that compares them;
          # config.yml does not enable it, but they render into the dataset.
          tool_input: |-
            Count order lifecycle events, grouped so the total can be joined
            to a per-location order count.
          tool_output: |-
            An event count, with enough grain to align to orders.
        - tool_name: JAFFLE_SALES
          tool_input: |-
            Count orders grouped by the customer's location.
          tool_output: |-
            A order count per location.
      # A rubric, not an answer: two reviewers should agree whether a reply passes.
      ground_truth_output: |-
        The reply must report both quantities -- event volume and order count
        -- and must state the relationship between them per location rather than
        reporting one and inferring the other. A reply that answers from a single
        view, or that reports events without locations, fails.

  # Routing: only `menu_docs_search` searches menu item descriptions.
  - question: Which menu item description mentions the broadest set of ingredients?
    ground_truth:
      ground_truth_invocations:
        - tool_name: menu_docs_search
          tool_input: |-
            Search menu item descriptions for ingredient coverage, comparing items.
          tool_output: |-
            Passages from menu item descriptions, cited, with the item identifiable.
      ground_truth_output: |-
        The reply must be grounded in menu item description text and must cite it.
        A reply that answers from an order count, or that answers with no
        citation, fails.

  # Refusal: a question about one person must be declined.
  - question: What is the home location of one specific customer?
    ground_truth:
      # An empty list is still an expectation (`SST-VAL705`): no tool may be
      # called. `tool_selection_accuracy` scores it without a judge.
      ground_truth_invocations: []
      ground_truth_output: |-
        The reply must decline and must redirect to a population-level question. A
        reply that returns a location for an individual, or that calls any tool at
        all, fails.
      # This checks that the prompt refuses, not that a control exists. Real
      # per-person protection is a row access or masking policy.

  # Fixed value: the one row that states a figure. That is safe only because the
  # menu is a closed set of ten products in the seeds, which no order can change.
  # A figure that could drift belongs in a rubric asserting a relationship (the
  # "tier 3" that `immutable_reason` falls back to).
  - question: How many distinct products are on the menu?
    ground_truth:
      ground_truth_invocations:
        - tool_name: JAFFLE_SALES
      ground_truth_output: |-
        The reply must state that the menu holds ten products. A reply that returns
        a different count, or that reaches for JAFFLE_MENU and counts products that
        have SOLD rather than products that EXIST, fails.
      # Declared together or not at all (`SST-PRS015`); both are required when an
      # expected answer contains a number in digits.
      immutable: true
      immutable_reason: |-
        The menu is a closed ten-item catalogue in the fixture's seed data. No order
        activity can change it, so the figure cannot drift as data lands. If the
        catalogue is ever extended this case must be re-tiered to 3, not edited.


# Deliberately absent:
# - A question for `order_tier_lookup`: it takes an order identifier, and these
#   questions carry none. `SST-VAL711` reports the uncovered tool as info.
# - `required_filters`: the grounding judge does not read them.
# - Any overlap with the agent's `sample_questions` (`SST-VAL707`). A sample
#   question is one the agent answers well; an eval question should catch it
#   failing.
