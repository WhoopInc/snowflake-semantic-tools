# =============================================================================
# packages.yml -- the reference-impl fixture
# =============================================================================
# THIS FILE WAS MISSING, AND ITS ABSENCE MADE THE FIXTURE UNBUILDABLE.
#
# `MEASURED` 2026-09-24, `dbt build` with dbt-core 1.11.15 against a real
# account: four model YAMLs call `dbt_utils.unique_combination_of_columns` --
# `orders`, `order_items`, `pricing_periods` and `supplies` -- and with no
# package declaration each raised
#
#   Compilation Error ... 'dbt_utils' is undefined. This can happen when calling
#   a macro that does not exist.
#
# THE DAMAGE WAS NOT LIMITED TO THE TESTS. A test that fails to COMPILE fails its
# node, and dbt skips everything downstream: the run ended
# `PASS=29 ERROR=3 SKIP=11`, and among the eleven skipped were the `orders` and
# `customers` MODELS THEMSELVES. So the fixture's two busiest marts never built,
# and the composite-grain assertion that is the whole point of those four tests
# never ran.
#
# NOTHING IN THE PLAN TREE COULD HAVE CAUGHT THIS. All eight instruments are
# offline text checks; `dbt_utils` is undefined only at Jinja render time, inside
# dbt, against a warehouse. It was found by installing dbt and running it.
#
# WHY THE VERSION IS A RANGE AND NOT A PIN. `dbt_utils` follows dbt-core's minor
# cadence and a hard pin here would fight `require-dbt-version` in
# `dbt_project.yml` on every core bump. The range is narrow enough that the macro
# signature used by the four tests -- `combination_of_columns` -- is stable
# across it.
#
# NO DATA VALUES.
# =============================================================================

packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]
