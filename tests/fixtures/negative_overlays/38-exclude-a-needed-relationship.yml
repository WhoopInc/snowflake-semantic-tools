---
# A view of line items that drops the relationship its kept metric line_item_count joins through.
semantic_views:
  - name: line_items_without_orders
    description: |-
      Use this view for questions about line items and the products on them.
    tables:
      - "{{ ref('order_items') }}"
      - "{{ ref('orders') }}"
      - "{{ ref('products') }}"
    variables:
      - name: large_order_cents
        data_type: NUMBER
        description: |-
          Threshold above which an order counts as large.
        default_value: 1000
      - name: tax_inclusive
        data_type: BOOLEAN
        description: |-
          Whether revenue metrics should include collected tax.
        default_value: false
    exclude_relationships:
      - "{{ relationship('order_items_to_orders') }}"
