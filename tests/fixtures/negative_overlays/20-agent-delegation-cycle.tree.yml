---
# Two agents that delegate to each other.
files:
  agents/cycle_a/agent.yml: |
    name: cycle_a
    spec:
      models:
        orchestration: claude-sonnet-4-6
      tools:
        - name: cycle_b
          type: agent
          agent: "{{ agent('cycle_b') }}"
          description: Delegate every question to the second agent.
  agents/cycle_b/agent.yml: |
    name: cycle_b
    spec:
      models:
        orchestration: claude-sonnet-4-6
      tools:
        - name: cycle_a
          type: agent
          agent: "{{ agent('cycle_a') }}"
          description: Delegate every question to the first agent.
