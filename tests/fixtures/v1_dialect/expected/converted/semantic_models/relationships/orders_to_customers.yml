# The whole document is indented two spaces, root key included. YAML permits
# it and 0.3 parsed it; a parser that anchors root keys at column 0 would see
# no relationships here at all.
relationship:
  name: orders_to_customers
  left_table: "{{ ref('orders') }}"
  right_table: "{{ ref('customers') }}"
  # The 0.3 pair form: 1.0 rejects it (SST-PRS020) for relationship_conditions.
  relationship_columns:
    - left_column: "{{ ref('orders', 'customer_id') }}"
      right_column: "{{ ref('customers', 'customer_id') }}"
