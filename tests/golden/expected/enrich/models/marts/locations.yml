---
# locations: the target of orders_to_locations. It carries one fact (tax_rate)
# and no metric of its own, and only jaffle_sales reads it.

version: 2

models:
  - name: locations
    description: |-
      One row per store location.
    config:
      contract:
        enforced: true
      on_schema_change: fail
      meta:
        sst:
          primary_key:
            - location_id
    columns:
      - name: location_id
        data_type: VARCHAR
        description: |-
          Surrogate key for the location. An identifier, therefore a dimension.
        config:
          meta:
            sst:
              column_type: dimension
              sample_values:
                - L-01
                - L-02
                - L-03
              is_enum: false
              synonyms:
                - location key
                - shop identifier
        data_tests:
          - unique
          - not_null

      - name: location_name
        data_type: VARCHAR
        description: |-
          The store's trading name.
        config:
          meta:
            sst:
              column_type: dimension
              is_enum: false
              synonyms:
                - shop name
                - store name
                - branch
              sample_values:
                - Philadelphia
                - Brooklyn

      - name: opened_at
        data_type: TIMESTAMP_NTZ
        description: |-
          When the location opened for trade.
        config:
          meta:
            sst:
              column_type: dimension
              synonyms:
                - opening date
                - when the shop opened
              sample_values:
                - "2023-03-01 08:00:00"
                - "2023-09-15 08:00:00"

              is_enum: false
      - name: tax_rate
        data_type: NUMBER(38,4)
        description: |-
          Local sales tax rate applied at this location.
        config:
          meta:
            sst:
              column_type: fact
              synonyms:
                - sales tax rate
                - tax percentage
              sample_values:
                - 0.08
                - 0.0875
      - name: region
        config:
          meta:
            sst:
              column_type: dimension
              data_type: TEXT
              synonyms:
                - area
                - territory
              sample_values:
                - east
                - west
              is_enum: true
