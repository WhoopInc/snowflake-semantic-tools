[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "snowflake-semantic-tools"
version = "1.0.0.dev0"
description = "Compile and publish Snowflake semantic views, Cortex Agents, skills, and CoCo Desktop profiles from a dbt project"
readme = "README.md"
authors = ["Matt Luizzi <matthew.luizzi@whoop.com>"]
license = "Apache-2.0"
repository = "https://github.com/WhoopInc/snowflake-semantic-tools"
homepage = "https://github.com/WhoopInc/snowflake-semantic-tools"
keywords = ["snowflake", "dbt", "semantic-layer"]

[tool.poetry.scripts]
# Main CLI entry points
snowflake-semantic-tools = "snowflake_semantic_tools.cli.main:cli"
sst = "snowflake_semantic_tools.cli.main:cli"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pyyaml = ">=6.0.2,<7.0"
# Round-trip YAML for sst enrich, which edits dbt and view files in place.
ruamel-yaml = ">=0.18.6,<0.19"
snowflake-connector-python = {extras = ["secure-local-storage"], version = ">=3.12.3,<5.0"}
click = ">=8.1.7,<9.0"
dbt-snowflake = {version = ">=1.8,<2.0", optional = true}

[tool.poetry.extras]
# pip install snowflake-semantic-tools[dbt] installs dbt Core with the Snowflake
# adapter. SST runs whichever dbt is on PATH, so a dbt Cloud CLI user skips it.
dbt = ["dbt-snowflake"]

[tool.poetry.group.dev.dependencies]
pre-commit = "4.0.1"
pytest = "9.0.3"
pytest-cov = "6.0.0"
mypy = "1.13.0"
import-linter = "^2.1"
types-PyYAML = "^6.0.12"
ruff = ">=0.16"
hypothesis = ">=6.100"
pytest-xdist = ">=3.6"
mutmut = ">=3.2"
bandit = ">=1.8"
pip-audit = ">=2.7"

[tool.bandit]
# B608 flags every SQL statement assembled from strings, which is how the connector and the
# renderers build SQL today; the skip is temporary.
# TODO: remove the B608 skip once SQL is assembled by the typed SQL builder.
skips = ["B608"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "PIE", "T10", "LOG", "G", "ICN", "TID", "PGH"]

# Absolute imports only; tests/unit/test_import_style.py enforces the same rule with its own scan.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# cli/main.py imports `cli.commands` only for its side effect -- registering every command on
# `cli` -- so the import is unused by name. The package's planning-identifier scan rejects a
# rule code in source, so the exemption lives here rather than as an inline comment.
[tool.ruff.lint.per-file-ignores]
"snowflake_semantic_tools/cli/main.py" = ["F401"]

# Frozen dataclasses (and DiagnosticBag, a tuple) are immutable, so sharing one instance as a
# default argument is safe; B008 cannot tell them from mutable calls without this list.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "snowflake_semantic_tools.app.evals.suite.EvalGateRequest",
    "snowflake_semantic_tools.app.lifecycle.evals.EvalLifecycleConfig",
    "snowflake_semantic_tools.domain.model.diagnostic.DiagnosticBag",
    "snowflake_semantic_tools.domain.model.eval.EvalDefaults",
    "snowflake_semantic_tools.domain.model.lifecycle.ApplyOptions",
    "snowflake_semantic_tools.domain.model.lifecycle.rendered.DesiredMetadata",
    "snowflake_semantic_tools.domain.model.lifecycle.rendered.PublishShape",
    "snowflake_semantic_tools.domain.model.lifecycle.rendered.StatementPlan",
]

[tool.ruff.lint.isort]
known-first-party = ["snowflake_semantic_tools", "tests"]

[tool.coverage.run]
branch = true
source = [
    "snowflake_semantic_tools/domain",
    "snowflake_semantic_tools/app",
    "snowflake_semantic_tools/cli",
    "snowflake_semantic_tools/adapters",
]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "test-coverage-results/coverage.xml"

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
exclude = [
]
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so test modules can import shared test support as `tests.helpers.*`.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --color=yes --durations=10"
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ring boundaries: cli -> (app | adapters) -> domain. These contracts ARE the
# enforcement -- an architecture rule that lives only in a README is a comment.
# tests/unit/test_ring_boundaries.py proves each contract rejects a crossing.
#
# Run with: lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "snowflake_semantic_tools"
# Required because the domain/ and app/ contracts forbid third-party packages
# (yaml, click, snowflake, ...) and not just internal modules.
include_external_packages = true

# cli -> (app | adapters) -> domain.
# app and adapters are SIBLINGS declared independent: app must not reach for a
# concrete adapter, and an adapter must not call back into a use case. cli is the
# composition root above both and may import anything.
#
# The delimiter is load-bearing and the two are near-opposites: "|" makes siblings
# INDEPENDENT (neither may import the other), ":" makes them non-independent (both
# may). An earlier draft used ":" here, which licensed the exact crossing this
# contract exists to forbid -- caught by tests/unit/test_ring_boundaries.py.
[[tool.importlinter.contracts]]
name = "Rings are layered: cli above (app | adapters) above domain"
type = "layers"
layers = [
    "snowflake_semantic_tools.cli",
    "snowflake_semantic_tools.app | snowflake_semantic_tools.adapters",
    "snowflake_semantic_tools.domain",
]

# domain/ is the pure ring: no I/O, no clock, no environment. Everything it needs
# from the outside world arrives as a PARAMETER. This is what makes rendering a
# pure function of its input, hence the manifest byte-reproducible, hence golden
# testing possible.
[[tool.importlinter.contracts]]
name = "domain is pure -- no I/O, no clock, no environment, no SDKs"
type = "forbidden"
source_modules = ["snowflake_semantic_tools.domain"]
forbidden_modules = [
    "yaml",
    "click",
    "snowflake",
    "os",
    "pathlib",
    "datetime",
    "time",
    "random",
    "tempfile",
    "subprocess",
    "socket",
    "logging",
]

# app/ orchestrates domain through injected ports. It never touches an SDK, and it
# never touches the terminal -- that is cli's job.
[[tool.importlinter.contracts]]
name = "app imports domain only -- no SDKs, no terminal"
type = "forbidden"
source_modules = ["snowflake_semantic_tools.app"]
forbidden_modules = [
    "yaml",
    "click",
    "snowflake",
]

# An adapter may depend on the ports it implements and the models it returns, but
# not on domain's renderers -- rendering is domain logic, not edge work.
[[tool.importlinter.contracts]]
name = "adapters use domain ports and models, not domain renderers"
type = "forbidden"
source_modules = ["snowflake_semantic_tools.adapters"]
forbidden_modules = ["snowflake_semantic_tools.domain.render"]

# An adapter subpackage never imports another, so each stays replaceable and testable
# alone. Top-level adapter modules outside these four may compose them.
[[tool.importlinter.contracts]]
name = "adapter subpackages are independent"
type = "independence"
modules = [
    "snowflake_semantic_tools.adapters.yaml",
    "snowflake_semantic_tools.adapters.dbt",
    "snowflake_semantic_tools.adapters.snowflake",
    "snowflake_semantic_tools.adapters.fs",
]

# Round-trip YAML editing lives in adapters.roundtrip, used by the dbt and yaml adapters to
# write files in place; nothing else may reach for ruamel.
[[tool.importlinter.contracts]]
name = "only the roundtrip, dbt and yaml adapters edit YAML"
type = "forbidden"
source_modules = [
    "snowflake_semantic_tools.cli",
    "snowflake_semantic_tools.app",
    "snowflake_semantic_tools.domain",
    "snowflake_semantic_tools.adapters.snowflake",
    "snowflake_semantic_tools.adapters.fs",
    "snowflake_semantic_tools.adapters.clock",
    "snowflake_semantic_tools.adapters.errors",
    "snowflake_semantic_tools.adapters.project_source",
]
forbidden_modules = ["ruamel"]
allow_indirect_imports = true

# YAML is parsed only at the edge that owns the file: adapters.yaml for SST's own files,
# adapters.dbt for dbt's. Only direct imports count here -- everything above reaches
# yaml indirectly through those two, which is the point.
[[tool.importlinter.contracts]]
name = "only the yaml and dbt adapters parse YAML"
type = "forbidden"
source_modules = [
    "snowflake_semantic_tools.cli",
    "snowflake_semantic_tools.adapters.snowflake",
    "snowflake_semantic_tools.adapters.fs",
    "snowflake_semantic_tools.adapters.clock",
    "snowflake_semantic_tools.adapters.errors",
    "snowflake_semantic_tools.adapters.project_source",
]
forbidden_modules = ["yaml"]
allow_indirect_imports = true
